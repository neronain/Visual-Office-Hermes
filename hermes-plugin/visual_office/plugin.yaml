name: visual_office
version: "0.1.0"
description: >-
  Visual Office for Hermes — every session and subagent becomes a character at a
  desk, and every desk is pinned to a model of your choosing (a LiteGate alias, a
  cloud model, or a local server). Adds the `office_delegate` tool so the agent
  can hand a task to a named desk instead of a nameless subagent. Enable with
  `hermes plugins enable visual_office`, then open the office server.
  Optional env: VISUAL_OFFICE_URL, VISUAL_OFFICE_TOKEN, VISUAL_OFFICE_DESKS.
author: neronain
hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - post_api_request
  - pre_approval_request
  - post_approval_response
  - subagent_start
  - subagent_stop
