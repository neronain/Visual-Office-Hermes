# รายชื่อโต๊ะ — ไฟล์เดียวที่บอกว่าโต๊ะไหนใช้โมเดลอะไร
#
# ติดตั้งไว้ที่ ~/.hermes/visual-office/desks.yaml (ตัวติดตั้งคัดลอกให้)
# แก้แล้วมีผลตั้งแต่ข้อความถัดไป — ปลั๊กอินอ่านไฟล์ใหม่เองเมื่อเวลาแก้ไขเปลี่ยน
# หรือจะแก้จากหน้าเว็บก็ได้ (ปุ่ม "จัดการ" ในแผงขวาของห้อง)
#
# โต๊ะมีสองแบบ เลือกได้ทีละโต๊ะ:
#
#   1. ผ่าน gateway (ไม่ใส่ base_url) — เป็น subagent เต็มรูปของ Hermes มี tools
#      มี session · แต่ Hermes ส่งให้ลูกได้แค่ "ชื่อโมเดล" ปลายทางจริงสืบทอดจากตัวแม่
#      เสมอ ตัวแม่จึงต้องชี้ไปยังที่ที่เรียกได้ครบทุก alias ในไฟล์นี้ = หน้าที่ของ gateway
#      ข้อเสีย: gateway ล่มเมื่อไร โต๊ะแบบนี้ตายทั้งหมด
#
#   2. ยิงตรง (ใส่ base_url) — คุยกับ endpoint นั้นตรง ๆ แบบ OpenAI-compatible
#      ไม่มี tools ไม่มี session ถาม-ตอบอย่างเดียว · แลกมาด้วยการที่มันยังทำงานได้
#      ตอน gateway ล่ม และสั่งจากห้องแล้วตอบทันทีโดยไม่ต้องรอโมเดลหลักตัดสินใจ
#
# ข้อควรระวังที่เจอมาแล้ว: ถ้า llama.cpp ปลายทางรัน --parallel 1 (ค่าปกติ) อย่าให้
# โต๊ะชี้ไปเครื่องเดียวกับโมเดลหลักของ Hermes — มันจะต่อคิวหลัง prompt แสนโทเคน
# ของตัวแม่ทุกครั้งที่คุณคุยกับ Hermes ซึ่งเป็นเวลาที่คุณอยากใช้โต๊ะพอดี

version: 1

office:
  name: Visual Office

gateway:
  # เขียนไว้ให้คนอ่านและให้หน้าเว็บแสดง — ตัวที่ใช้จริงคือ model.base_url ใน
  # ~/.hermes/config.yaml ต้องตั้งให้ตรงกัน
  base_url: http://192.168.139.140:8080/v1

desks:
  - id: coder
    label: ช่างโค้ด
    model: coder-next
    origin: local
    provider: litegate
    note: โมเดลโค้ด 80B MoE บน Spark ของเราเอง
    toolsets: [file, terminal, web, todo]

  - id: reviewer
    label: คนตรวจงาน
    model: claude-sonnet-4.8
    origin: local
    provider: litegate
    note: อ่านภาพได้ คิดเป็นขั้นตอน context 262K
    toolsets: [file, web, todo]

  - id: runner
    label: คนวิ่งงานย่อย
    model: claude-haiku-4.8
    origin: local
    provider: litegate
    note: งานสั้น ๆ ที่ไม่ต้องคิดมาก
    toolsets: [file, web]

  # โต๊ะแบบยิงตรง — ไม่ผ่าน gateway จึงไม่ตายตามมัน
  # ช่อง model ตรงนี้คือ "ชื่อที่ endpoint นั้นเสิร์ฟ" ไม่ใช่ alias ของ gateway
  # toolsets ใส่ไปก็ไม่มีผล (ตัวอ่าน roster จะเตือนให้)
  - id: solo
    label: ตัวสำรอง
    model: qwen3-8-27b-heretic-abliterated-uncensored-gguf
    origin: local
    provider: llama.cpp
    note: ยิงตรงที่เครื่องของตัวเอง · ใช้ได้แม้ gateway ล่ม
    base_url: http://10.0.0.9:8002/v1
    # ใส่เมื่อ endpoint ต้องใช้คีย์ · เก็บ "ชื่อ env" ไม่ใช่ตัวคีย์
    # ค่าจริงอยู่ใน environment หรือ ~/.hermes/.env
    # api_key_env: SOLO_ENDPOINT_API_KEY

  # เปิดใช้เมื่อเพิ่ม endpoint คลาวด์ใน LiteGate แล้ว — origin: cloud ทำให้
  # ตัวละครใส่ปลอกคอสีเหลือง เตือนว่าโต๊ะนี้จ่ายตามการใช้งาน
  # - id: vision
  #   label: คนดูรูป
  #   model: gemini-2.5-flash
  #   origin: cloud
  #   provider: gemini
  #   note: อ่านรูปและเอกสารสแกน
  #   toolsets: [file, vision, web]
